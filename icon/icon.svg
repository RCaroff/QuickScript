<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Fond dégradé : violet profond → indigo -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a1d6e"/>
      <stop offset="100%" stop-color="#1e1a4a"/>
    </linearGradient>

    <!-- Bolt jaune-orangé -->
    <linearGradient id="bolt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="55%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>

    <!-- Ombre douce sous le bolt -->
    <filter id="boltShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle (rounded square façon macOS Big Sur+) -->
  <rect x="100" y="100" width="824" height="824"
        rx="185" ry="185"
        fill="url(#bg)"/>

  <!-- Lightning bolt centré -->
  <path d="M 632 184
           L 332 540
           L 504 540
           L 392 840
           L 692 484
           L 520 484
           Z"
        fill="url(#bolt)"
        stroke="#FFA000"
        stroke-width="6"
        stroke-linejoin="round"
        filter="url(#boltShadow)"/>
</svg>
